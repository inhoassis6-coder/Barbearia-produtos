<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão Inho Dú Corte</title>
  <style>
    :root {
      --bg-primary: #121212;
      --bg-secondary: #1e1e1e;
      --accent: #d4af37;
      --text-light: #f5f5f5;
      --text-muted: #aaaaaa;
      --danger: #e53935;
      --success: #43a047;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background-color: var(--bg-secondary);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1, h2 {
      text-align: center;
      color: var(--accent);
      margin-bottom: 15px;
    }
    .hidden { display: none !important; }
    
    /* Login Form */
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 16px;
    }
    button {
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 10px;
    }
    button:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background-color: #333;
      color: #fff;
    }
    .btn-danger {
      background-color: var(--danger);
      color: #fff;
    }
    
    /* Navigation */
    nav {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
    }
    nav button {
      padding: 8px;
      font-size: 12px;
      margin-top: 0;
    }

    /* Cards e Listas */
    .card {
      background-color: #282828;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid var(--accent);
    }
    .card-title {
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 5px;
    }
    .card-info {
      font-size: 14px;
      color: var(--text-muted);
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tela de Login -->
    <div id="auth-screen">
      <h1>Inho Dú Corte</h1>
      <h2>Acesso ao Sistema</h2>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seu-email@gmail.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="Sua senha">
      </div>
      <button id="btn-login">Entrar</button>
      <button id="btn-signup" class="btn-secondary">Criar Conta</button>
      <p id="auth-error" style="color: var(--danger); font-size: 14px; margin-top: 10px; text-align: center;"></p>
    </div>

    <!-- Painel Principal -->
    <div id="app-screen" class="hidden">
      <div class="flex-between" style="margin-bottom: 15px;">
        <h2 style="margin: 0;">Gestão Barbearia</h2>
        <button id="btn-logout" class="btn-danger" style="width: auto; padding: 5px 10px; font-size: 12px;">Sair</button>
      </div>

      <nav>
        <button onclick="showTab('vendas')">Vendas</button>
        <button onclick="showTab('estoque')">Estoque</button>
        <button onclick="showTab('fiado')">Fiado</button>
      </nav>

      <!-- Aba Vendas -->
      <div id="tab-vendas" class="tab-content">
        <h3>Registrar Venda</h3>
        <div class="form-group">
          <label>Item / Serviço</label>
          <input type="text" id="venda-item" placeholder="Ex: Corte de Cabelo">
        </div>
        <div class="form-group">
          <label>Valor (R$)</label>
          <input type="number" id="venda-valor" placeholder="30.00" step="0.01">
        </div>
        <button id="btn-salvar-venda">Lançar Venda</button>

        <h3 style="margin-top: 20px;">Histórico Hoje</h3>
        <div id="lista-vendas"></div>
      </div>

      <!-- Aba Estoque -->
      <div id="tab-estoque" class="tab-content hidden">
        <h3>Cadastrar Produto</h3>
        <div class="form-group">
          <label>Nome do Produto</label>
          <input type="text" id="prod-nome" placeholder="Ex: Pomada Modeladora">
        </div>
        <div class="form-group">
          <label>Quantidade</label>
          <input type="number" id="prod-qtd" placeholder="10">
        </div>
        <div class="form-group">
          <label>Preço de Venda (R$)</label>
          <input type="number" id="prod-preco" placeholder="25.00" step="0.01">
        </div>
        <button id="btn-salvar-produto">Salvar Produto</button>

        <h3 style="margin-top: 20px;">Produtos Cadastrados</h3>
        <div id="lista-estoque"></div>
      </div>

      <!-- Aba Fiado -->
      <div id="tab-fiado" class="tab-content hidden">
        <h3>Registo de Fiado</h3>
        <div class="form-group">
          <label>Nome do Cliente</label>
          <input type="text" id="fiado-cliente" placeholder="Ex: João">
        </div>
        <div class="form-group">
          <label>Descrição do Serviço/Produto</label>
          <input type="text" id="fiado-desc" placeholder="Corte + Barba">
        </div>
        <div class="form-group">
          <label>Valor Deve (R$)</label>
          <input type="number" id="fiado-valor" placeholder="50.00" step="0.01">
        </div>
        <button id="btn-salvar-fiado">Cadastrar Conta</button>

        <h3 style="margin-top: 20px;">Contas Pendentes</h3>
        <div id="lista-fiado"></div>
      </div>
    </div>
  </div>

  <!-- Firebase Scripts (Módulos ES) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      getDocs, 
      query, 
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuração do teu Firebase com ID do banco 'barbeariajaer'
    const firebaseConfig = {
      projectId: "barbeariajaer",
      authDomain: "barbeariajaer.firebaseapp.com",
      storageBucket: "barbeariajaer.appspot.com"
    };

    // Inicialização
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Elementos da Interface
    const authScreen = document.getElementById('auth-screen');
    const appScreen = document.getElementById('app-screen');
    const authError = document.getElementById('auth-error');

    // Funções de Autenticação
    document.getElementById('btn-login').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      signInWithEmailAndPassword(auth, email, pass)
        .catch(err => authError.innerText = "Erro ao entrar: " + err.message);
    });

    document.getElementById('btn-signup').addEventListener('click', () => {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      createUserWithEmailAndPassword(auth, email, pass)
        .catch(err => authError.innerText = "Erro ao cadastrar: " + err.message);
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
      signOut(auth);
    });

    // Monitorizar sessão de utilizador
    onAuthStateChanged(auth, (user) => {
      if (user) {
        authScreen.classList.add('hidden');
        appScreen.classList.remove('hidden');
        carregarDados();
      } else {
        authScreen.classList.remove('hidden');
        appScreen.classList.add('hidden');
      }
    });

    // Gravação no Firestore
    document.getElementById('btn-salvar-venda').addEventListener('click', async () => {
      const item = document.getElementById('venda-item').value;
      const valor = parseFloat(document.getElementById('venda-valor').value);
      if(item && valor) {
        await addDoc(collection(db, "vendas"), { item, valor, data: new Date() });
        document.getElementById('venda-item').value = '';
        document.getElementById('venda-valor').value = '';
        carregarDados();
      }
    });

    document.getElementById('btn-salvar-produto').addEventListener('click', async () => {
      const nome = document.getElementById('prod-nome').value;
      const qtd = parseInt(document.getElementById('prod-qtd').value);
      const preco = parseFloat(document.getElementById('prod-preco').value);
      if(nome && qtd) {
        await addDoc(collection(db, "estoque"), { nome, qtd, preco });
        document.getElementById('prod-nome').value = '';
        document.getElementById('prod-qtd').value = '';
        document.getElementById('prod-preco').value = '';
        carregarDados();
      }
    });

    document.getElementById('btn-salvar-fiado').addEventListener('click', async () => {
      const cliente = document.getElementById('fiado-cliente').value;
      const desc = document.getElementById('fiado-desc').value;
      const valor = parseFloat(document.getElementById('fiado-valor').value);
      if(cliente && valor) {
        await addDoc(collection(db, "fiados"), { cliente, desc, valor, pago: false });
        document.getElementById('fiado-cliente').value = '';
        document.getElementById('fiado-desc').value = '';
        document.getElementById('fiado-valor').value = '';
        carregarDados();
      }
    });

    // Carregar dados salvos no Firebase
    async function carregarDados() {
      // Vendas
      const vendasSnap = await getDocs(collection(db, "vendas"));
      const listaVendas = document.getElementById('lista-vendas');
      listaVendas.innerHTML = '';
      vendasSnap.forEach(doc => {
        const d = doc.data();
        listaVendas.innerHTML += `<div class="card"><div class="card-title">${d.item}</div><div class="card-info">R$ ${d.valor.toFixed(2)}</div></div>`;
      });

      // Estoque
      const estoqueSnap = await getDocs(collection(db, "estoque"));
      const listaEstoque = document.getElementById('lista-estoque');
      listaEstoque.innerHTML = '';
      estoqueSnap.forEach(doc => {
        const d = doc.data();
        listaEstoque.innerHTML += `<div class="card"><div class="card-title">${d.nome}</div><div class="card-info">Qtd: ${d.qtd} | Preço: R$ ${d.preco.toFixed(2)}</div></div>`;
      });

      // Fiados
      const fiadosSnap = await getDocs(collection(db, "fiados"));
      const listaFiado = document.getElementById('lista-fiado');
      listaFiado.innerHTML = '';
      fiadosSnap.forEach(doc => {
        const d = doc.data();
        listaFiado.innerHTML += `<div class="card"><div class="card-title">${d.cliente}</div><div class="card-info">${d.desc} - R$ ${d.valor.toFixed(2)}</div></div>`;
      });
    }

    // Alternar Abas
    window.showTab = function(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tabName).classList.remove('hidden');
    }
  </script>
</body>
</html>
